<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Figura 18</title>
<style>
html,body{margin:0;padding:0;background:#fff}
body{width:1100px;height:420px;overflow:hidden}
svg{display:block;font-family:Arial,Helvetica,sans-serif}
.panel{fill:#fff;stroke:#c3ccd6;stroke-width:1.5}
.plabel{font-size:15px;font-weight:700;fill:#1d2733;letter-spacing:.06em}
.box{fill:#eef2f6;stroke:#2f3e4e;stroke-width:1.5}
.soft{fill:#f6f8fa;stroke:#8795a5;stroke-width:1.3;stroke-dasharray:6 4}
.t{font-size:19px;font-weight:700;fill:#1d2733}
.s{font-size:16.5px;fill:#33404d}
.sm{font-size:15px;fill:#4a5866}
.ln{stroke:#2f3e4e;stroke-width:1.6;fill:none}
.dash{stroke:#5c6b7a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ok{fill:#edf6f0;stroke:#2e7a4c;stroke-width:1.6}
.ko{fill:#fbefef;stroke:#ad3a3a;stroke-width:1.6}
.gate{fill:#2f3e4e}
.gt{font-size:17px;font-weight:700;fill:#fff}
</style></head><body>
<svg width="1100" height="420" viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f3e4e"/></marker>
  <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6b7a"/></marker>
</defs>

<!-- Panel GitHub -->
<rect class="panel" x="10" y="10" width="706" height="400" rx="10"/>
<text class="plabel" x="30" y="38">GITHUB</text>

<!-- Ramas -->
<rect class="box" x="30" y="56" width="176" height="78" rx="8"/>
<text class="t" x="118" y="88" text-anchor="middle">Rama de trabajo</text>
<text class="s" x="118" y="113" text-anchor="middle">un cambio nuevo</text>

<rect class="box" x="262" y="56" width="176" height="78" rx="8"/>
<text class="t" x="350" y="88" text-anchor="middle">staging</text>
<text class="s" x="350" y="113" text-anchor="middle">reúne los cambios</text>

<rect class="box" x="494" y="56" width="202" height="78" rx="8"/>
<text class="t" x="595" y="84" text-anchor="middle">main</text>
<text class="s" x="595" y="106" text-anchor="middle">acepta PR solo desde</text>
<text class="s" x="595" y="126" text-anchor="middle">staging o Dependabot</text>

<line class="ln" x1="206" y1="95" x2="258" y2="95" marker-end="url(#a)"/>
<text class="sm" x="232" y="86" text-anchor="middle">PR</text>
<line class="ln" x1="438" y1="95" x2="490" y2="95" marker-end="url(#a)"/>
<text class="sm" x="464" y="86" text-anchor="middle">PR</text>

<!-- Disparadores de CI -->
<line class="dash" x1="350" y1="134" x2="350" y2="178" marker-end="url(#ad)"/>
<line class="dash" x1="595" y1="134" x2="595" y2="178" marker-end="url(#ad)"/>
<text class="sm" x="360" y="162">PR y push</text>
<text class="sm" x="605" y="162">PR y push</text>

<!-- GitHub Actions -->
<rect class="soft" x="30" y="182" width="666" height="210" rx="8"/>
<text x="48" y="210"><tspan class="t" style="font-size:18px">GitHub Actions</tspan><tspan class="s" dx="8">corre cuatro controles en cada cambio</tspan></text>

<rect class="box" x="48" y="224" width="148" height="92" rx="7"/>
<text class="t" style="font-size:16.5px" x="122" y="250" text-anchor="middle">Política de ramas</text>
<text class="s" x="122" y="274" text-anchor="middle">origen del PR</text>
<text class="s" x="122" y="296" text-anchor="middle">permitido</text>

<rect class="box" x="208" y="224" width="148" height="92" rx="7"/>
<text class="t" style="font-size:17px" x="282" y="250" text-anchor="middle">Calidad</text>
<text class="s" x="282" y="274" text-anchor="middle">formato, lint</text>
<text class="s" x="282" y="296" text-anchor="middle">y tipos</text>

<rect class="box" x="368" y="224" width="148" height="92" rx="7"/>
<text class="t" style="font-size:17px" x="442" y="250" text-anchor="middle">Pruebas</text>
<text class="s" x="442" y="274" text-anchor="middle">base PostgreSQL</text>
<text class="s" x="442" y="296" text-anchor="middle">efímera</text>

<rect class="box" x="528" y="224" width="150" height="92" rx="7"/>
<text class="t" style="font-size:17px" x="603" y="250" text-anchor="middle">Construcción</text>
<text class="s" x="603" y="274" text-anchor="middle">web, API</text>
<text class="s" x="603" y="296" text-anchor="middle">y worker</text>

<line class="ln" x1="122" y1="316" x2="122" y2="338" marker-end="url(#a)"/>
<line class="ln" x1="282" y1="316" x2="282" y2="338" marker-end="url(#a)"/>
<line class="ln" x1="442" y1="316" x2="442" y2="338" marker-end="url(#a)"/>
<line class="ln" x1="603" y1="316" x2="603" y2="338" marker-end="url(#a)"/>

<rect class="gate" x="48" y="342" width="630" height="36" rx="7"/>
<text class="gt" x="363" y="366" text-anchor="middle">Compuerta: aprueba solo si pasan los cuatro</text>


<!-- Panel Railway -->
<rect class="panel" x="740" y="10" width="350" height="400" rx="10"/>
<text class="plabel" x="760" y="38">RAILWAY · PRODUCCIÓN</text>
<!-- Conexiones hacia Railway -->
<path class="ln" d="M696,80 L756,80" marker-end="url(#a)"/>
<path class="dash" d="M678,360 L728,360 L728,100 L756,100" marker-end="url(#ad)"/>

<rect class="box" x="760" y="56" width="310" height="54" rx="8"/>
<text class="t" style="font-size:16.5px" x="776" y="80">1. Espera el resultado de CI</text>
<text class="s" x="776" y="101">para cada cambio en main</text>

<line class="ln" x1="915" y1="110" x2="915" y2="124" marker-end="url(#a)"/>
<rect class="box" x="760" y="128" width="310" height="40" rx="8"/>
<text class="t" style="font-size:16.5px" x="776" y="154">2. Construye web, API y worker</text>

<line class="ln" x1="915" y1="168" x2="915" y2="182" marker-end="url(#a)"/>
<rect class="box" x="760" y="186" width="310" height="40" rx="8"/>
<text class="t" style="font-size:16.5px" x="776" y="212">3. La API aplica las migraciones</text>

<line class="ln" x1="915" y1="226" x2="915" y2="240" marker-end="url(#a)"/>
<rect class="box" x="760" y="244" width="310" height="40" rx="8"/>
<text class="t" style="font-size:16.5px" x="776" y="270">4. ¿Web y API responden en /health?</text>

<line class="ln" x1="915" y1="284" x2="915" y2="298" marker-end="url(#a)"/>
<rect class="ok" x="760" y="302" width="310" height="36" rx="8"/>
<text class="s" x="776" y="326"><tspan font-weight="700" fill="#245f3b">Sí:</tspan> la nueva versión queda en línea</text>
<rect class="ko" x="760" y="346" width="310" height="56" rx="8"/>
<text class="s" x="776" y="369"><tspan font-weight="700" fill="#8f2d2d">No:</tspan> sigue la versión anterior,</text>
<text class="s" x="776" y="391">pero la migración ya quedó aplicada</text>
</svg>
</body></html>
